<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniShop - E-Commerce App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">🛍️ MiniShop</div>

        <div class="cart">
            🛒 Cart <span id="cartCount">0</span>
        </div>
    </header>

    <main>

        <section class="hero">
            <h1>Welcome to MiniShop</h1>
            <p>Simple & Interactive E-Commerce App</p>

            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
            >
        </section>

        <section class="products-section">
            <h2>Our Products</h2>

            <div id="productContainer" class="products"></div>
        </section>

        <section class="cart-section">
            <h2>Shopping Cart</h2>

            <div id="cartItems">
                <p class="empty">Your cart is empty.</p>
            </div>

            <div class="cart-summary">
                <h3>
                    Total:
                    ₹<span id="totalPrice">0</span>
                </h3>

                <button id="checkoutBtn" disabled>
                    🧾 Checkout
                </button>
            </div>
        </section>

    </main>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">

        <div class="modal-content">

            <span id="closeModal" class="close">&times;</span>

            <h2>🧾 Checkout Preview</h2>

            <div id="checkoutDetails"></div>

            <h3>
                Total:
                ₹<span id="checkoutTotal">0</span>
            </h3>

            <button id="placeOrderBtn">
                ✅ Place Order
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
